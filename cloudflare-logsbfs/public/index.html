<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用中心 - 待办事项 & SSL 证书监控</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 自定义 Tailwind 配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          },
        }
      }
    }
  </script>
  
  <!-- Font Awesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* 自定义样式 */
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .tab-active {
      border-bottom: 3px solid #0ea5e9;
      color: #0ea5e9;
    }
    
    .card-hover {
      transition: all 0.3s ease;
    }
    
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .tag-badge {
      transition: all 0.2s ease;
    }
    
    .tag-badge:hover {
      transform: scale(1.05);
    }
    
    /* 加载动画 */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    
    /* 淡入动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease;
    }
    
    /* Toast 通知样式 */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      min-width: 300px;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    /* 隐藏滚动条但保持可滚动 */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 min-h-screen">
  
  <!-- Toast 通知容器 -->
  <div id="toast-container"></div>
  
  <!-- 主容器 -->
  <div class="container mx-auto px-4 py-6 max-w-7xl">
    
    <!-- 顶部导航栏 -->
    <header class="glass-effect rounded-2xl shadow-lg mb-6 p-4 fade-in">
      <div class="flex flex-col sm:flex-row items-center justify-between">
        <!-- Logo 和标题 -->
        <div class="flex items-center space-x-3 mb-4 sm:mb-0">
          <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center text-white shadow-lg">
            <i class="fas fa-rocket text-2xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-800">应用中心</h1>
            <p class="text-sm text-gray-500">多功能管理平台</p>
          </div>
        </div>
        
        <!-- 导航标签 -->
        <nav class="flex space-x-1 bg-white rounded-xl p-1 shadow-inner">
          <button 
            id="tab-todos" 
            class="tab-button px-6 py-2.5 rounded-lg font-medium text-gray-600 hover:text-primary-600 hover:bg-primary-50 transition-all duration-200 tab-active"
            onclick="switchTab('todos')">
            <i class="fas fa-check-circle mr-2"></i>
            <span class="hidden sm:inline">待办事项</span>
            <span class="sm:hidden">待办</span>
          </button>
          <button 
            id="tab-certificates" 
            class="tab-button px-6 py-2.5 rounded-lg font-medium text-gray-600 hover:text-primary-600 hover:bg-primary-50 transition-all duration-200"
            onclick="switchTab('certificates')">
            <i class="fas fa-shield-alt mr-2"></i>
            <span class="hidden sm:inline">证书监控</span>
            <span class="sm:hidden">证书</span>
          </button>
        </nav>
      </div>
    </header>
    
    <!-- 待办事项视图 -->
    <div id="view-todos" class="view-container fade-in">
      <div class="glass-effect rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-list-check text-primary-500 mr-2"></i>
            我的待办事项
          </h2>
          <div class="text-sm text-gray-500">
            共 <span id="todo-count" class="font-bold text-primary-600">0</span> 项
          </div>
        </div>
        
        <!-- 错误提示 -->
        <div id="todo-error" class="hidden mb-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg">
          <i class="fas fa-exclamation-triangle mr-2"></i>
          <span id="todo-error-message"></span>
        </div>
        
        <!-- 添加待办事项 -->
        <div class="flex gap-3 mb-6">
          <input 
            type="text" 
            id="new-todo-input" 
            placeholder="添加新的待办事项..." 
            class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
            onkeypress="if(event.key === 'Enter') addTodo()">
          <button 
            onclick="addTodo()" 
            class="px-6 py-3 gradient-bg text-white font-medium rounded-xl hover:shadow-lg hover:scale-105 transition-all duration-200 whitespace-nowrap">
            <i class="fas fa-plus mr-2"></i>
            添加
          </button>
        </div>
        
        <!-- 加载中 -->
        <div id="todo-loading" class="text-center py-12">
          <i class="fas fa-spinner animate-spin text-4xl text-primary-500 mb-4"></i>
          <p class="text-gray-500">加载中...</p>
        </div>
        
        <!-- 待办事项列表 -->
        <ul id="todo-list" class="space-y-3 hidden"></ul>
        
        <!-- 空状态 -->
        <div id="todo-empty" class="hidden text-center py-12">
          <i class="fas fa-clipboard-check text-6xl text-gray-300 mb-4"></i>
          <p class="text-gray-500 text-lg">还没有待办事项</p>
          <p class="text-gray-400 text-sm mt-2">添加一个开始管理你的任务吧！</p>
        </div>
      </div>
    </div>
    
    <!-- SSL 证书监控视图 -->
    <div id="view-certificates" class="view-container hidden">
      <div class="glass-effect rounded-2xl shadow-lg p-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
          <h2 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-certificate text-primary-500 mr-2"></i>
            域名证书监控
          </h2>
          <div class="flex flex-wrap gap-2">
            <button 
              onclick="showAddCertificateModal()" 
              class="px-4 py-2 gradient-bg text-white font-medium rounded-lg hover:shadow-lg hover:scale-105 transition-all duration-200">
              <i class="fas fa-plus mr-2"></i>
              添加域名
            </button>
            <button 
              onclick="checkAllCertificates()" 
              class="px-4 py-2 bg-white text-gray-700 font-medium rounded-lg border border-gray-300 hover:bg-gray-50 hover:shadow transition-all duration-200">
              <i class="fas fa-sync-alt mr-2"></i>
              全部刷新
            </button>
            <select 
              id="tag-filter" 
              onchange="filterCertificatesByTag()"
              class="px-4 py-2 bg-white text-gray-700 font-medium rounded-lg border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
              <option value="">全部标签</option>
            </select>
          </div>
        </div>
        
        <!-- 错误提示 -->
        <div id="cert-error" class="hidden mb-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg">
          <i class="fas fa-exclamation-triangle mr-2"></i>
          <span id="cert-error-message"></span>
        </div>
        
        <!-- 加载中 -->
        <div id="cert-loading" class="text-center py-12">
          <i class="fas fa-spinner animate-spin text-4xl text-primary-500 mb-4"></i>
          <p class="text-gray-500">加载中...</p>
        </div>
        
        <!-- 证书网格 -->
        <div id="cert-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        
        <!-- 空状态 -->
        <div id="cert-empty" class="hidden text-center py-12">
          <i class="fas fa-shield-alt text-6xl text-gray-300 mb-4"></i>
          <p class="text-gray-500 text-lg">还没有添加域名</p>
          <p class="text-gray-400 text-sm mt-2">点击"添加域名"开始监控证书</p>
        </div>
      </div>
    </div>
    
  </div>
  
  <!-- 添加域名模态框 -->
  <div id="add-cert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 fade-in">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold text-gray-800">
          <i class="fas fa-plus-circle text-primary-500 mr-2"></i>
          添加新域名
        </h3>
        <button onclick="closeAddCertificateModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">域名地址</label>
          <input 
            type="text" 
            id="new-cert-domain" 
            placeholder="例如：example.com 或 sub.example.com" 
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
          <p class="mt-1 text-xs text-gray-500">
            <i class="fas fa-info-circle mr-1"></i>
            支持主域名和子域名
          </p>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">标签（可选）</label>
          <div id="tag-checkboxes" class="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
            <!-- 动态生成标签复选框 -->
          </div>
          <div class="mt-3">
            <input 
              type="text" 
              id="new-tag-input" 
              placeholder="添加新标签" 
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
            <button 
              onclick="addNewTag()" 
              class="mt-2 w-full px-3 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
              <i class="fas fa-tag mr-1"></i>
              创建新标签
            </button>
          </div>
        </div>
      </div>
      
      <div class="flex gap-3 mt-6">
        <button 
          onclick="closeAddCertificateModal()" 
          class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200 transition-colors">
          取消
        </button>
        <button 
          onclick="addCertificate()" 
          class="flex-1 px-4 py-3 gradient-bg text-white font-medium rounded-xl hover:shadow-lg hover:scale-105 transition-all duration-200">
          添加
        </button>
      </div>
    </div>
  </div>
  
  <!-- 引入 JavaScript -->
  <script src="app.js"></script>
  
</body>
</html>
