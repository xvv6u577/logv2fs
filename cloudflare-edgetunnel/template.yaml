port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
ipv6: true
dns:
  enable: true
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
  - type: vless
    name: cf-uvp-443
    server: 172.67.148.181
    port: 443
    uuid: 7d2a8695-ee88-484d-8bea-ad86c95e6ff6
    network: ws
    tls: true
    udp: false
    servername: uvp-1.undervineyard.link
    client-fingerprint: chrome
    ws-opts:
      path: "/?ed=2048"
      headers:
        Host: uvp-1.undervineyard.link

  - type: vless
    name: cf-uvp-80
    server: 172.67.148.181
    port: 80
    uuid: 7d2a8695-ee88-484d-8bea-ad86c95e6ff6
    network: ws
    tls: false
    udp: false
    servername: uvp-1.undervineyard.link
    client-fingerprint: chrome
    ws-opts:
      path: "/?ed=2048"
      headers:
        Host: uvp-1.undervineyard.link

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - cf-uvp-443
      - cf-uvp-80
      - DIRECT

  - name: 自动选择
    type: url-test
    proxies:
      - cf-uvp-443
      - cf-uvp-80
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
